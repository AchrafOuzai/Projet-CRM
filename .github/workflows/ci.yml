name: ShopCRM CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main]

jobs:

  backend-tests:
    name: Symfony Backend
    runs-on: ubuntu-latest

    env:
      APP_ENV: test
      APP_SECRET: testsecretkey123456789012345678
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/crm_ecommerce_test?serverVersion=8.0

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: crm_ecommerce_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mbstring, curl

      - name: Install dependencies
        working-directory: backend-symfony
        run: composer install --no-interaction --prefer-dist --no-scripts

      - name: Reset database
        working-directory: backend-symfony
        run: |
          php bin/console doctrine:database:drop --force --if-exists --env=test
          php bin/console doctrine:database:create --env=test

      - name: Clear Symfony cache
        working-directory: backend-symfony
        run: php bin/console cache:clear --env=test

      - name: Check PHP syntax
        working-directory: backend-symfony
        run: find src -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Run database migrations
        working-directory: backend-symfony
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Run PHPUnit tests
        working-directory: backend-symfony
        run: php bin/phpunit --testdox


  frontend-build:
    name: Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Build Angular
        working-directory: frontend-angular
        run: npm run build -- --configuration production


  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker images
        run: docker compose build

      - name: Start containers
        run: docker compose up -d

      - name: Wait for services
        run: sleep 20

      - name: Check containers status
        run: docker compose ps

      - name: Show backend logs
        run: docker compose logs backend