<div  class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-blue-950 flex items-center justify-center p-4">
  <div class="w-full max-w-sm">
    <div class="bg-white rounded-2xl shadow-2xl p-8">

      <!-- Logo -->
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
          <ng-icon name="heroSquares2x2" class="text-white" size="28"></ng-icon>
        </div>
        <h1 class="font-display font-black text-2xl text-slate-900 tracking-tight">ShopCRM</h1>
        <p class="text-slate-500 text-sm mt-1">Créez votre espace e-commerce</p>
      </div>

      <!-- Succès -->
      <div *ngIf="success"
           class="mb-4 flex items-center gap-2 bg-green-50 border border-green-200 text-green-700 text-sm px-4 py-3 rounded-lg">
        <ng-icon name="heroCheckCircle" size="16" class="shrink-0"></ng-icon>
        {{success}}
      </div>

      <!-- Erreur -->
      <div *ngIf="error"
           class="mb-4 flex items-center gap-2 bg-red-50 border border-red-200 text-red-700 text-sm px-4 py-3 rounded-lg">
        <ng-icon name="heroExclamationTriangle" size="16" class="shrink-0"></ng-icon>
        {{error}}
      </div>

      <div class="space-y-4">

        <!-- Nom entreprise -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">
            Nom de votre entreprise *
          </label>
          <div class="relative">
            <ng-icon name="heroBuildingOffice2" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="16"></ng-icon>
            <input type="text" [(ngModel)]="form.nom"
                   placeholder="Ma Boutique"
                   class="w-full border-[1.5px] border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-slate-900 text-sm outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100 placeholder:text-slate-400">
          </div>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Email *</label>
          <div class="relative">
            <ng-icon name="heroEnvelope" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="16"></ng-icon>
            <input type="email" [(ngModel)]="form.email"
                   placeholder="contact@maboutique.com"
                   class="w-full border-[1.5px] border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-slate-900 text-sm outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100 placeholder:text-slate-400">
          </div>
        </div>

        <!-- Mot de passe -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Mot de passe *</label>
          <div class="relative">
            <ng-icon name="heroLockClosed" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="16"></ng-icon>
            <input type="password" [(ngModel)]="form.password"
                   placeholder="••••••••"
                   class="w-full border-[1.5px] border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-slate-900 text-sm outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100 placeholder:text-slate-400">
          </div>
        </div>

        <!-- Confirmer mot de passe -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Confirmer le mot de passe *</label>
          <div class="relative">
            <ng-icon name="heroLockClosed" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" size="16"></ng-icon>
            <input type="password" [(ngModel)]="form.confirm"
                   placeholder="••••••••"
                   (keyup.enter)="register()"
                   class="w-full border-[1.5px] border-slate-200 rounded-lg pl-9 pr-3 py-2.5 text-slate-900 text-sm outline-none transition-all focus:border-blue-500 focus:ring-2 focus:ring-blue-100 placeholder:text-slate-400">
          </div>
        </div>

        <!-- Plan -->
        <div>
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wide mb-1.5">Plan</label>
          <div class="grid grid-cols-3 gap-2">
            <label *ngFor="let p of ['free','pro','enterprise']"
                   class="flex flex-col items-center p-3 border-[1.5px] rounded-lg cursor-pointer transition-all"
                   [class.border-blue-500]="form.plan === p"
                   [class.bg-blue-50]="form.plan === p"
                   [class.border-slate-200]="form.plan !== p">
              <input type="radio" [(ngModel)]="form.plan" [value]="p" class="hidden">
              <span class="text-xs font-bold uppercase"
                    [class.text-blue-600]="form.plan === p"
                    [class.text-slate-500]="form.plan !== p">
                {{p}}
              </span>
            </label>
          </div>
        </div>

      </div>

      <!-- Bouton créer -->
      <button (click)="register()" [disabled]="loading"
              class="w-full mt-6 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold text-sm py-2.5 px-4 rounded-lg shadow-md transition-all hover:-translate-y-0.5 flex items-center justify-center gap-2">
        <ng-icon *ngIf="loading" name="heroArrowPath" size="16" class="animate-spin"></ng-icon>
        <ng-icon *ngIf="!loading" name="heroUserPlus" size="16"></ng-icon>
        <span>{{loading ? 'Création...' : 'Créer mon compte'}}</span>
      </button>

      <!-- Retour login -->
      <button (click)="goToLogin()"
              class="w-full mt-3 text-slate-500 hover:text-blue-600 text-sm font-medium transition-colors flex items-center justify-center gap-1.5">
        <ng-icon name="heroArrowLeft" size="14"></ng-icon>
        Retour à la connexion
      </button>

      <!-- Note agents -->
      <div class="mt-5 p-3 bg-slate-50 rounded-lg border border-slate-200">
        <p class="text-xs text-slate-500 text-center leading-relaxed">
          <ng-icon name="heroInformationCircle" size="13" class="inline mr-1"></ng-icon>
          Vous êtes un agent ? Votre administrateur vous créera un accès directement depuis le CRM.
        </p>
      </div>

    </div>
  </div>
</div>
