<div class="page-header">
  <h1>⚙️ Configuration Data</h1>
  <p>Paramètres et données de référence du système</p>
</div>

<div class="tab-nav">
  <button [class.active]="activeTab===0" (click)="activeTab=0">🏙️ Villes</button>
  <button [class.active]="activeTab===1" (click)="activeTab=1">👥 Agents</button>
  <button [class.active]="activeTab===2" (click)="activeTab=2">🌐 Sites</button>
  <button [class.active]="activeTab===3" (click)="activeTab=3">🛡️ Admins</button>
  <button [class.active]="activeTab===4" (click)="activeTab=4">📂 Catégories</button>
  <button [class.active]="activeTab===5" (click)="activeTab=5">💰 Finances</button>
</div>

<!-- VILLES -->
<div *ngIf="activeTab===0" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">🏙️ Liste des villes & frais de livraison</h3>
  <div style="display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap">
    <input type="text" [(ngModel)]="newVille" placeholder="Nom ville" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;flex:1">
    <input type="number" [(ngModel)]="newVilleFrais" placeholder="Frais DH" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;width:120px">
    <button class="btn btn-primary" (click)="addVille()">+ Ajouter</button>
  </div>
  <div class="table-container">
    <table>
      <thead><tr><th>Ville</th><th>Frais livraison (DH)</th><th>Actions</th></tr></thead>
      <tbody>
        <tr *ngFor="let v of config.villes; let i=index">
          <td><strong>{{v.nom}}</strong></td>
          <td><input type="number" [(ngModel)]="v.fraisLivraison" style="background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:6px;color:var(--text);width:100px"></td>
          <td><button class="btn btn-danger btn-sm" (click)="removeVille(i)">🗑️</button></td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- AGENTS -->
<div *ngIf="activeTab===1" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">👥 Agents de confirmation</h3>
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <input type="text" [(ngModel)]="newAgent" placeholder="Nom agent" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;flex:1">
    <button class="btn btn-primary" (click)="addAgent()">+ Ajouter</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div *ngFor="let a of config.agents; let i=index" style="display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px">
      <span>{{a}}</span>
      <button (click)="removeAgent(i)" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
    </div>
  </div>
</div>

<!-- SITES -->
<div *ngIf="activeTab===2" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">🌐 Sites web</h3>
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <input type="text" [(ngModel)]="newSite" placeholder="Nom site" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;flex:1">
    <button class="btn btn-primary" (click)="addSite()">+ Ajouter</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div *ngFor="let s of config.sites; let i=index" style="display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px">
      <span>{{s}}</span>
      <button (click)="removeSite(i)" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
    </div>
  </div>
</div>

<!-- ADMINS -->
<div *ngIf="activeTab===3" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">🛡️ Administrateurs</h3>
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <input type="text" [(ngModel)]="newAdmin" placeholder="Nom admin" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;flex:1">
    <button class="btn btn-primary" (click)="addAdmin()">+ Ajouter</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div *ngFor="let a of config.admins; let i=index" style="display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px">
      <span>{{a}}</span>
      <button (click)="removeAdmin(i)" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
    </div>
  </div>
</div>

<!-- CATEGORIES -->
<div *ngIf="activeTab===4" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">📂 Catégories de produits</h3>
  <div style="display:flex;gap:12px;margin-bottom:16px">
    <input type="text" [(ngModel)]="newCategorie" placeholder="Nom catégorie" style="background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:10px;color:var(--text);outline:none;flex:1">
    <button class="btn btn-primary" (click)="addCategorie()">+ Ajouter</button>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:10px">
    <div *ngFor="let c of config.categoriesProduits; let i=index" style="display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:8px 14px">
      <span class="badge confirmee">{{c}}</span>
      <button (click)="removeCategorie(i)" style="background:none;border:none;color:var(--danger);cursor:pointer">✕</button>
    </div>
  </div>
</div>

<!-- FINANCES -->
<div *ngIf="activeTab===5" class="card">
  <h3 style="font-family:'Syne',sans-serif;font-size:1rem;margin-bottom:16px">💰 Paramètres financiers</h3>
  <div class="form-row cols-2">
    <div class="form-group">
      <label>Frais téléphonique (DH/mois)</label>
      <input type="number" [(ngModel)]="config.fraisTelephonique">
    </div>
    <div class="form-group">
      <label>Prix par commande livrée (DH)</label>
      <input type="number" [(ngModel)]="config.prixParCommandeLivree">
    </div>
  </div>
</div>

<div style="margin-top:24px">
  <button class="btn btn-primary" (click)="save()">
    {{saved ? '✅ Sauvegardé !' : '💾 Sauvegarder la configuration'}}
  </button>
</div>
