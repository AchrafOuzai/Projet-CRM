<div class="login-page">
  <div class="login-card">
    <div class="login-logo">⚡ ShopCRM</div>
    <p class="login-sub">Connectez-vous à votre espace</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="email" placeholder="admin@crm.com">
    </div>

    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" [(ngModel)]="password" placeholder="••••••••">
    </div>

    <div class="login-error" *ngIf="error">{{error}}</div>

    <button class="btn btn-primary" style="width:100%;justify-content:center"
            (click)="login()" [disabled]="loading">
      {{loading ? 'Connexion...' : '🔐 Se connecter'}}
    </button>
  </div>
</div>
