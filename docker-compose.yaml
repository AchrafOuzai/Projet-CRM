version: '3.8'

services:

  database:
    image: mysql:8.0
    container_name: crm_database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_db
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3307:3306"      # ← changed 3306 to 3307
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network

  backend:
    build:
      context: ./backend-gestion-produits
      dockerfile: Dockerfile
    container_name: crm_backend
    environment:
      DATABASE_URL: "mysql://crm_user:crm_password@database:3306/crm_db?serverVersion=8.0"
      APP_ENV: dev        # ← changed from prod to dev
      APP_SECRET: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
    depends_on:
      - database
    networks:
      - crm_network

  nginx:
    image: nginx:alpine
    container_name: crm_nginx
    ports:
      - "8000:80"
    volumes:
      - ./backend-gestion-produits:/var/www/symfony
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - crm_network

  frontend:
    build:
      context: ./gestion-produits
      dockerfile: Dockerfile
    container_name: crm_frontend
    ports:
      - "4200:80"
    depends_on:
      - nginx
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  db_data: