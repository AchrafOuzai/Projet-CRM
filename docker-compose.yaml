services:

  database:
    image: mysql:8.0
    container_name: shopcrm_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crm_ecommerce
      MYSQL_USER: crm_user
      MYSQL_PASSWORD: crm_password
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - crm_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend-symfony
      dockerfile: Dockerfile
    container_name: shopcrm_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "mysql://crm_user:crm_password@database:3306/crm_ecommerce?serverVersion=8.0"
      APP_ENV: dev
      APP_SECRET: a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4
      CORS_ALLOW_ORIGIN: "http://localhost:4200"
      DOCKERIZED: "true"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - crm_network
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    container_name: shopcrm_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend-symfony:/var/www/symfony
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - crm_network

  frontend:
    build:
      context: ./frontend-angular
      dockerfile: Dockerfile
    container_name: shopcrm_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - nginx
    networks:
      - crm_network

networks:
  crm_network:
    driver: bridge

volumes:
  db_data: