nelmio_cors:
  defaults:
    origin_regex: false
    allow_origin: ['http://localhost:4200']
    allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
    allow_headers: ['Content-Type', 'Authorization', 'Accept']
    expose_headers: ['Link']
    max_age: 3600

  paths:
    '^/api/':
      origin_regex: false
      allow_origin: ['http://localhost:4200']
      allow_headers: ['Content-Type', 'Authorization', 'Accept']
      allow_methods: ['GET', 'OPTIONS', 'POST', 'PUT', 'PATCH', 'DELETE']
      max_age: 3600